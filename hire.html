<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photography portfolio contact page">
    <title>Photography Portfolio | Contact</title>
    <link rel="stylesheet" href="css/master.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icon logo.png">
</head>
<body>

    <header class="site-header" id="mainHeader">
        <a class="nav__logo" href="home.html" aria-label="Home">
            <img src="assets/logo.png" alt="Portfolio logo">
        </a>
        <button class="nav__menu__btn" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false">
            <i class="ri-menu-3-line"></i>
        </button>
        <nav aria-label="Main navigation">
            <ul class="nav__links" id="nav-links"></ul>
        </nav>
        <div class="site-header__socials" data-social-location="header" aria-label="Social links"></div>
    </header>

    <div class="floating-elements" id="floatingElements"></div>

    <section class="hire-me">
        <div class="hire-profile-image" data-db-image="contact" hidden><img id="profileImage" alt=""></div>
        <h1 data-content="contact.title"></h1>
        <p data-content="contact.description"></p>

        <div class="contact">
            <a href="#" id="emailBtn">
                <i class="ri-mail-line"></i>
                <span data-content="contact.emailLabel"></span>
            </a>
            <a href="#" id="callBtn">
                <i class="ri-phone-line"></i>
                <span data-content="contact.phoneLabel"></span>
            </a>
            <div class="socials" data-social-location="contact"></div>
        </div>

        <div class="end-section">
            <h2 data-content="contact.closingTitle"></h2>
            <p data-content="contact.closingDescription"></p>
        </div>

        <div class="cms-photo-section" data-photo-location="contact" hidden></div>
    </section>

    <footer class="site-footer">
        <div class="section__container footer__container">
            <div class="footer__col">
                <h4 class="section__header" data-content="footer.contactTitle"></h4>
                <p data-content="footer.introduction"></p>
            </div>
            <div class="footer__col">
                <h4 class="section__header" data-content="footer.officeTitle"></h4>
                <p data-content="contact.location"></p>
            </div>
            <div class="footer__col">
                <h4 class="section__header" data-content="footer.socialTitle"></h4>
                <ul class="footer__socials" data-social-location="footer"></ul>
            </div>
        </div>
        <div class="footer__bar">
            <span data-content="footer.copyright"></span>
        </div>
    </footer>

    <script src="Javascript/public-cms.js"></script>
    <script src="Javascript/hire.js"></script>

</body>
</html>
