<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photography portfolio">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/master.css" />
  <title>Photography Portfolio</title>
  <link rel="icon" type="image/png" href="assets/icon logo.png">
</head>

<body>
  <header class="site-header">
    <a class="nav__logo" href="home.html" aria-label="Home">
      <img src="assets/logo.png" alt="Portfolio logo" />
    </a>
    <button class="nav__menu__btn" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false">
      <i class="ri-menu-3-line"></i>
    </button>
    <nav aria-label="Main navigation">
      <ul class="nav__links" id="nav-links"></ul>
    </nav>
    <div class="site-header__socials" data-social-location="header" aria-label="Social links"></div>
  </header>

  <header id="home">
    <div class="section__container header__container">
      <div class="header__image" data-db-image="hero" hidden>\n        <img alt="" />\n      </div>\n      <div class="header__content">
        <h1 data-content="home.heroTitle"></h1>
        <h2 data-content="home.heroSubtitle"></h2>
        <div class="header__btn">
          <a class="btn" href="hire.html" data-content="home.ctaText"></a>
        </div>
      </div>
    </div>
  </header>

  <section class="section__container about__container" id="about">
    <div class="about__image" data-db-image="about" hidden>\n      <img alt="" />\n    </div>\n    <div class="about__content">
      <h2 class="section__header" data-content="home.aboutTitle"></h2>
      <p data-content="home.introduction"></p>
      <div class="about__btn">
        <a class="btn" href="photography.html" data-content="home.aboutCta"></a>
      </div>
    </div>
  </section>

  <section class="section__container portfolio__container" id="portfolio">
    <h2 class="section__header" data-content="home.portfolioTitle"></h2>
    <p data-content="home.portfolioDescription"></p>
    <div class="cms-photo-section" data-photo-location="featured" hidden></div>
    <div class="portfolio__grid" data-home-photos></div>
    <div class="site-section__socials" data-social-location="homepage" aria-label="Homepage social links"></div>
  </section>

  <footer class="site-footer">
    <div class="section__container footer__container">
      <div class="footer__col">
        <h4 class="section__header" data-content="footer.contactTitle"></h4>
        <p data-content="footer.introduction"></p>
      </div>
      <div class="footer__col">
        <h4 class="section__header" data-content="footer.officeTitle"></h4>
        <p data-content="contact.location"></p>
      </div>
      <div class="footer__col">
        <h4 class="section__header" data-content="footer.socialTitle"></h4>
        <ul class="footer__socials" data-social-location="footer"></ul>
      </div>
    </div>
    <div class="footer__bar">
      <span data-content="footer.copyright"></span>
    </div>
  </footer>

  <script src="https://unpkg.com/scrollreveal"></script>
  <script src="Javascript/public-cms.js"></script>
  <script src="Javascript/home.js"></script>
</body>

</html>
